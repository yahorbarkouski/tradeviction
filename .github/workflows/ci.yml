name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unused code, formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradeviction
          POSTGRES_PASSWORD: tradeviction
          POSTGRES_DB: tradeviction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeviction -d tradeviction_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tradeviction:tradeviction@127.0.0.1:5432/tradeviction_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
